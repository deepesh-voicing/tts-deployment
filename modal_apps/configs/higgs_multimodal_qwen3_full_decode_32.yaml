# Higgs Audio v3 Stage 0 FULL_DECODE_ONLY CUDA-graph A/B profile.
# This intentionally matches higgs_multimodal_qwen3.yaml except for the
# Stage 0 graph mode, so the existing 20-frame playback buffer is held constant.
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      codec_chunk_frames: 25
      codec_left_context_frames: 25
      codec_right_holdback_frames: 4
      initial_codec_chunk_frames: 20
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 5000
      connector_get_max_wait: 500
stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.6
    enforce_eager: false
    attention_backend: FLASHINFER
    attention_config:
      use_trtllm_attention: false
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: false
    compilation_config:
      cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32]
      cudagraph_mode: FULL_DECODE_ONLY
      cudagraph_num_of_warmups: 1
    max_num_batched_tokens: 4096
    max_model_len: 8192
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 1.0
      top_p: 0.95
      top_k: 50
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.0
  - stage_id: 1
    max_num_seqs: 16
    gpu_memory_utilization: 0.25
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0
platforms:
  rocm:
    stages:
      - stage_id: 0
        attention_backend: TRITON_ATTN

